[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-forge"
version = "0.1.0"
description = "Local-first workflow guardrails — planning, policy checks, validation, and auditable run records — around repository changes made by a human or a coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Autonomous Forge contributors" }]
keywords = ["automation", "maintenance", "cli", "repository"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Repository = "https://forgejo.familytechlab.com/frank/Autonomous_Forge"
Issues = "https://forgejo.familytechlab.com/frank/Autonomous_Forge/issues"

[project.optional-dependencies]
# Pinned to exact versions (AUTO-068 / SEC-007): a clean `pip install -e ".[dev]"`
# should not silently pick up a newer tool and change what CI enforces.
# Bump deliberately, not as a side effect of an unrelated change.
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "mypy==2.3.0",
]

[project.scripts]
forge = "autonomous_forge.cli:_entry_point"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately conservative: pyflakes + core pycodestyle error classes +
# import sorting. Ruff's plugin rule sets (bandit, pylint, flake8-simplify,
# etc.) are not enabled here — adopting them is a separate decision with its
# own cleanup pass, not something to fold into CI enforcement silently.
# S310 (AUTO-072) is the one exception: URL-scheme checking on urlopen is
# small (2 sites, both in forgejo_client.py), directly relevant to network
# egress safety, and worth enforcing rather than leaving purely advisory.
# The rest of the S (flake8-bandit) rule set stays out of this selection —
# S603/S607 (subprocess call / partial executable path) fire on every
# `git`/`python` invocation in a CLI whose entire job is shelling out to
# git, and are reviewed individually via inline `# noqa` instead (see the
# advisory `ruff check src --select S` CI step for anything not yet
# reviewed that way).
select = ["E4", "E7", "E9", "F", "I", "S310"]

[tool.mypy]
python_version = "3.10"
files = ["src/autonomous_forge"]

[tool.coverage.run]
source = ["autonomous_forge"]

[tool.coverage.report]
# 80% (AUTO-071) — deliberately well below the 89% baseline measured when
# this was added, not a tight gate. The point is catching a real regression
# (e.g. a large new module landing with no tests at all), not blocking
# ordinary small refactors on every coverage wobble. Tighten later if this
# proves too permissive; see docs/CI.md for the full rationale.
fail_under = 80

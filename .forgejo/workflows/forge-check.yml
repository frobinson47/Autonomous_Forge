name: forge check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: docker
    container:
      image: python:3.12
    steps:
      # actions/checkout@v4 is a Node.js action; the plain python:3.12 image
      # has neither git nor node, so both must be installed before checkout
      # can run at all.
      - name: Install git and node
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs

      - uses: actions/checkout@v4

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy

      - name: forge check
        run: forge check

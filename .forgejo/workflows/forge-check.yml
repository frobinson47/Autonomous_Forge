name: forge check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: docker
    # Matrix covers the full range pyproject.toml's classifiers claim
    # (AUTO-069 / COMP-005) — previously only 3.12 ran, silently narrower
    # than the advertised 3.10-3.12 support. Each image is pinned by its
    # current multi-arch manifest-list digest (AUTO-068 / SEC-007), not a
    # floating tag — still resolves correctly on any runner architecture.
    # Re-pin deliberately (e.g. for a Python patch release), not silently.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            image: python:3.10@sha256:579ae5f216574b07fdc36ccbb5bbc5d58d588659eede8a057cfdeb6d6e54a50f
          - python-version: "3.11"
            image: python:3.11@sha256:a8677eb08a56d04e75df938f9d2af3d50c0f0fba17af8eb9c8e41b65fa32938d
          - python-version: "3.12"
            image: python:3.12@sha256:ef1735ee20f31133880795148379e68f8fe12f4b7a1872075477567f022edc1f
    container:
      image: ${{ matrix.image }}
    steps:
      # actions/checkout@v4 is a Node.js action; the plain python:3.12 image
      # has neither git nor node, so both must be installed before checkout
      # can run at all.
      - name: Install git and node
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs

      # Pinned by commit digest (AUTO-068 / SEC-007), not the floating `v4`
      # tag — this is actions/checkout@v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy

      - name: forge check
        run: forge check

      # Coverage report with an enforced floor (AUTO-071): fail_under = 80
      # in pyproject.toml's [tool.coverage.report], well below the 89%
      # baseline measured when this was added — catches a real regression
      # (e.g. a large new untested module), not ordinary small refactors.
      # Runs the suite a second time (forge check already ran it above via
      # its own validation step); accepted as a small, deliberate CI-time
      # cost for visibility, not worth threading --cov through forge check
      # itself.
      - name: Coverage
        run: pytest --cov=autonomous_forge --cov-report=term-missing

      # Advisory only (AUTO-068 / SEC-007): this repo's [tool.ruff.lint]
      # selection is deliberately scoped to E4/E7/E9/F/I (see AUTO-055) —
      # Ruff's security-rule plugin (S / flake8-bandit) is not part of that
      # enforced set and is run here separately, non-blocking, so findings
      # are visible without silently reopening a large backlog the way
      # adopting the full out-of-the-box rule set would (AUTO-055 found 93
      # findings that way). continue-on-error means this step never fails
      # the job even if it reports findings.
      - name: Ruff security rules (advisory)
        continue-on-error: true
        run: ruff check src --select S
